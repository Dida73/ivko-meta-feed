name: Проверка на кода за Meta (само четене)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scan_gateway.py | tee scan_gateway.txt
      - run: |
          git config user.name "ivko-feed-bot"
          git config user.email "ivko-feed-bot@users.noreply.github.com"
          git add scan_gateway.txt
          git commit -m "Резултат: следи от шлюз в кода на сайта" || true
          git push
